<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Color Gate</title>
<style>
  :root {
    --bg: #0b1020;
    --fg: #e8ecff;
    --muted: #8f9bc7;
    --accent: #ffd84d;
    --c0: #ff5c7a;
    --c1: #5ca8ff;
    --c2: #ffd84d;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--fg);
  }
  canvas { display: block; position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    display: flex; justify-content: space-between; align-items: baseline;
    pointer-events: none; font-weight: 800;
  }
  #score { font-size: 36px; font-variant-numeric: tabular-nums; }
  #bestHud { font-size: 14px; color: var(--muted); }
  #pauseBtn {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06); color: var(--fg); font-size: 16px; font-weight: 800;
    padding: 0;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
    text-align: center; background: rgba(11,16,32,.72);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 44px; letter-spacing: .06em; line-height: 1.1; }
  h1 .r { color: var(--c0); } h1 .b { color: var(--c1); } h1 .y { color: var(--c2); }
  h2 { margin: 0; font-size: 32px; letter-spacing: .06em; }
  .how { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 320px; margin: 4px 0 8px; }
  .how b { color: var(--fg); }
  .big { font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 15px; }
  .record { color: var(--accent); font-weight: 800; font-size: 16px; letter-spacing: .1em; }
  button.main {
    font: inherit; font-size: 20px; font-weight: 800; padding: 14px 44px; margin-top: 8px;
    border: 0; border-radius: 999px; background: var(--accent); color: #1a1300;
    box-shadow: 0 6px 24px rgba(255,216,77,.35);
  }
  button.main:active { transform: scale(.96); }
  a.back { color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="bestHud">BEST 0</div>
</div>
<button id="pauseBtn" class="hidden" aria-label="一時停止">II</button>

<div id="title" class="overlay">
  <h1><span class="r">CO</span><span class="b">LO</span><span class="y">R</span><br>GATE</h1>
  <p class="how">上からゲートが降ってきます。<br><b>タップで自分の色が 赤→青→黄 に変わる。</b><br>ゲートの、自分がくぐる部分と<br>同じ色にして通り抜けよう！</p>
  <div class="sub" id="bestTitle"></div>
  <button class="main" id="startBtn">スタート</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<div id="pause" class="overlay hidden">
  <h2>一時停止</h2>
  <button class="main" id="resumeBtn">つづける</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<div id="over" class="overlay hidden">
  <h2>GAME OVER</h2>
  <div class="big" id="finalScore">0</div>
  <div class="record hidden" id="newRecord">NEW RECORD!</div>
  <div class="sub" id="finalInfo"></div>
  <button class="main" id="retryBtn">もう一度</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const COLORS = ['#ff5c7a', '#5ca8ff', '#ffd84d'];

  // ---------- 調整用パラメータ ----------
  const CFG = {
    speedBase: 150,   // ゲートの落下速度（U/秒）
    speedGain: 4,     // 1秒ごとに増える落下速度
    speedMax: 380,
    gapBase: 330,     // ゲート同士の間隔（U）
    gapMin: 190,
    gapShrink: 3,     // 1秒ごとに縮む間隔
    moveBase: 0.30,   // 自機の左右移動速度（画面幅/秒）
    moveGain: 0.006,
    moveMax: 0.65,
  };

  // ---------- 画面サイズ ----------
  let W, H, U, PY, PR;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.min(W, H * 0.6) / 360; // 基準単位（スマホ縦で約1px）
    PY = H * 0.78;
    PR = 13 * U;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 保存 ----------
  let best = 0;
  try { best = Number(localStorage.getItem('color-gate-best')) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('color-gate-best', String(best)); } catch (e) {} }

  // ---------- 状態 ----------
  let state = 'title'; // title | play | dying | over | pause
  let t = 0, score = 0, shake = 0, flash = 0, dyingT = 0, nextGap = 0;
  const p = { x: 0.5, dir: 1, color: 0, trail: [] }; // x は画面幅に対する割合
  let gates = [], parts = [], texts = [];

  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const rand = n => Math.floor(Math.random() * n);

  function reset() {
    t = 0; score = 0; shake = 0; flash = 0;
    p.x = 0.5; p.dir = Math.random() < 0.5 ? 1 : -1; p.color = 0; p.trail = [];
    gates = []; parts = []; texts = [];
    nextGap = 0;
    spawnGate(-20 * U);
    updateHud();
  }

  // 1〜3色に区切られたゲートを作る（隣り合う区画は別の色）
  function spawnGate(y) {
    let n = 1;
    if (t > 6) n = Math.random() < 0.5 ? 2 : 1;
    if (t > 18) n = 1 + rand(3);
    if (t > 40) n = Math.random() < 0.3 ? 2 : 3;
    const segs = [];
    const cuts = [0];
    for (let i = 1; i < n; i++) cuts.push((i + (Math.random() - 0.5) * 0.4) / n);
    cuts.push(1);
    let prev = -1;
    for (let i = 0; i < n; i++) {
      let c;
      do { c = rand(3); } while (c === prev);
      prev = c;
      segs.push({ a: cuts[i], b: cuts[i + 1], c });
    }
    gates.push({ y, segs, passed: false, hit: 0 });
  }

  function burst(x, y, color, n, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = (40 + Math.random() * 160) * U * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, d: 0.6 + Math.random() * 0.5, c: color, r: (1.5 + Math.random() * 2.5) * U });
    }
  }

  function updateHud() {
    $('score').textContent = score;
    $('bestHud').textContent = 'BEST ' + Math.max(best, score);
  }

  // ---------- 入力 ----------
  function cycle() {
    if (state !== 'play') return;
    p.color = (p.color + 1) % 3;
    flash = 1;
    burst(p.x * W, PY, COLORS[p.color], 6, 0.5);
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cycle(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'play') cycle();
      else if (state === 'title' || state === 'over') start();
      else if (state === 'pause') resume();
    }
  });

  function show(id) {
    ['title', 'pause', 'over'].forEach(o => $(o).classList.toggle('hidden', o !== id));
    $('hud').classList.toggle('hidden', state === 'title');
    $('pauseBtn').classList.toggle('hidden', id !== null);
  }

  function start() { reset(); state = 'play'; show(null); }
  function pause() { if (state === 'play') { state = 'pause'; show('pause'); } }
  function resume() { if (state === 'pause') { state = 'play'; show(null); last = performance.now(); } }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('resumeBtn').addEventListener('click', resume);
  $('pauseBtn').addEventListener('pointerdown', e => { e.stopPropagation(); });
  $('pauseBtn').addEventListener('click', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function die(gate) {
    state = 'dying'; dyingT = 0.9; shake = 14 * U;
    gate.hit = 1;
    const x = p.x * W;
    burst(x, PY, COLORS[p.color], 30, 1.4);
    burst(x, PY, '#ffffff', 12, 1.0);
    vib([60, 40, 90]);
    $('pauseBtn').classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    const isRecord = score > best;
    if (isRecord) { best = score; saveBest(); }
    $('finalScore').textContent = score;
    $('newRecord').classList.toggle('hidden', !isRecord || score === 0);
    $('finalInfo').textContent = `生存 ${t.toFixed(1)} 秒 ・ BEST ${best}`;
    updateHud();
    show('over');
  }

  const segAt = (g, fx) => g.segs.find(s => fx >= s.a && fx < s.b) || g.segs[g.segs.length - 1];

  // ---------- 更新 ----------
  function update(dt) {
    if (state === 'play') {
      t += dt;
      const speed = U * Math.min(CFG.speedBase + t * CFG.speedGain, CFG.speedMax);
      const gap = U * Math.max(CFG.gapBase - t * CFG.gapShrink, CFG.gapMin);
      const move = Math.min(CFG.moveBase + t * CFG.moveGain, CFG.moveMax);

      // 自機の左右往復
      const m = PR / W; // 端の余白（割合）
      p.x += p.dir * move * dt;
      if (p.x > 1 - m) { p.x = 1 - m; p.dir = -1; }
      if (p.x < m) { p.x = m; p.dir = 1; }
      p.trail.push(p.x * W);
      if (p.trail.length > 12) p.trail.shift();

      // ゲートの移動と判定
      for (const g of gates) {
        const prevY = g.y;
        g.y += speed * dt;
        if (!g.passed && prevY < PY && g.y >= PY) {
          g.passed = true;
          const seg = segAt(g, p.x);
          if (seg.c === p.color) {
            score++;
            texts.push({ x: p.x * W, y: PY, s: '+1', l: 1, c: COLORS[seg.c] });
            burst(p.x * W, PY, COLORS[seg.c], 14);
            vib(12);
            updateHud();
          } else {
            die(g);
            break;
          }
        }
      }
      gates = gates.filter(g => g.y < H + 40 * U);

      // 次のゲート
      const top = gates.reduce((mn, g) => Math.min(mn, g.y), Infinity);
      if (top === Infinity || top >= gap - 20 * U) spawnGate(top === Infinity ? -20 * U : top - gap);
    } else if (state === 'dying') {
      dyingT -= dt;
      if (dyingT <= 0) gameOver();
    } else if (state === 'title' || state === 'over') {
      // 背景でゆっくり動かす
      p.x = 0.5 + Math.sin(performance.now() / 1400) * 0.3;
      if (gates.length === 0) spawnGate(-20 * U);
      for (const g of gates) g.y += 60 * U * dt;
      gates = gates.filter(g => g.y < H + 40 * U);
      const top = gates.reduce((mn, g) => Math.min(mn, g.y), Infinity);
      if (top >= 260 * U) spawnGate(top - 300 * U);
    }

    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; q.l -= dt / q.d; }
    parts = parts.filter(q => q.l > 0);
    for (const s of texts) { s.y -= 40 * U * dt; s.l -= dt * 1.4; }
    texts = texts.filter(s => s.l > 0);
    for (const g of gates) if (g.hit > 0) g.hit = Math.max(0, g.hit - dt);
    shake *= Math.pow(0.02, dt);
    flash = Math.max(0, flash - dt * 5);
  }

  // ---------- 描画 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 自機の通り道
    ctx.strokeStyle = 'rgba(120,150,255,0.12)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6 * U, 8 * U]);
    ctx.beginPath(); ctx.moveTo(0, PY); ctx.lineTo(W, PY); ctx.stroke();
    ctx.setLineDash([]);

    const inGame = state === 'play' || state === 'dying' || state === 'pause';

    // ゲート
    const gh = 16 * U, pad = 3 * U;
    for (const g of gates) {
      ctx.globalAlpha = inGame ? 1 : 0.45;
      for (const s of g.segs) {
        const x0 = s.a * W + pad, x1 = s.b * W - pad;
        ctx.fillStyle = COLORS[s.c];
        ctx.shadowColor = COLORS[s.c]; ctx.shadowBlur = 10 * U;
        roundRect(x0, g.y - gh / 2, x1 - x0, gh, gh / 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (g.hit > 0) {
        ctx.globalAlpha = g.hit;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, g.y - gh / 2, W, gh);
      }
    }
    ctx.globalAlpha = 1;

    // 次にくぐる区画の目印（自機の真上に細い線）
    if (state === 'play') {
      const next = gates.filter(g => !g.passed).sort((a, b) => b.y - a.y)[0];
      if (next) {
        const seg = segAt(next, p.x);
        ctx.strokeStyle = COLORS[seg.c];
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 2 * U;
        ctx.beginPath(); ctx.moveTo(p.x * W, next.y + gh / 2); ctx.lineTo(p.x * W, PY - PR); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // 自機
    if (state !== 'dying' && state !== 'over') {
      const col = COLORS[p.color];
      for (let i = 0; i < p.trail.length; i++) {
        const k = i / p.trail.length;
        ctx.globalAlpha = k * 0.3;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(p.trail[i], PY, PR * k, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const x = p.x * W;
      ctx.shadowColor = col; ctx.shadowBlur = 20 * U;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, PY, PR * (1 + flash * 0.25), 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(x, PY, PR * 0.4, 0, TAU); ctx.fill();

      // 次の色のヒント
      if (inGame) {
        ctx.fillStyle = COLORS[(p.color + 1) % 3];
        ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.arc(x, PY + PR + 9 * U, 4 * U, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // パーティクル・テキスト
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.l);
      ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = `800 ${18 * U}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    for (const s of texts) {
      ctx.globalAlpha = Math.max(0, s.l);
      ctx.fillStyle = s.c;
      ctx.fillText(s.s, s.x, s.y - 24 * U);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- ループ ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (state !== 'pause') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  $('bestTitle').textContent = best > 0 ? `BEST ${best}` : '';
  show('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
