<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; user-select: none; }
  #info { margin: 10px; font-size: 18px; }
  #board { position: relative; display: grid; grid-template-columns: repeat(4, 80px); grid-gap: 8px; padding: 8px;
           background: #45475a; border-radius: 10px; touch-action: none; }
  .tile { width: 80px; height: 80px; border-radius: 6px; background: #313244; display: flex;
          align-items: center; justify-content: center; font-weight: bold; font-size: 30px; color: #1e1e2e; }
  #msg { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
         background: rgba(0,0,0,0.65); border-radius: 10px; font-size: 30px; font-weight: bold; gap: 12px; }
  button { font-size: 16px; padding: 8px 18px; border: none; border-radius: 8px; background: #89b4fa; color: #1e1e2e; cursor: pointer; }
  p { font-size: 13px; color: #a6adc8; }
</style>
</head>
<body>
<a href="../" style="position:fixed;top:10px;left:12px;color:#a6adc8;font-size:14px;text-decoration:none;z-index:10">← ゲーム一覧</a>
<div id="info">スコア: <span id="score">0</span> / ハイスコア: <span id="best">0</span></div>
<div id="board"><div id="msg"><span id="msgtext"></span><button id="retry">もう一度</button></div></div>
<p>矢印キー / WASD / スワイプで操作。同じ数字をぶつけて2048を目指そう</p>
<script>
const SIZE = 4;
const COLORS = { 0:'#313244', 2:'#cdd6f4', 4:'#b4befe', 8:'#fab387', 16:'#f9a56b', 32:'#f38ba8', 64:'#eb6f92',
                 128:'#f9e2af', 256:'#f5d98a', 512:'#a6e3a1', 1024:'#94e2d5', 2048:'#89b4fa' };
const el = id => document.getElementById(id);
const boardEl = el('board'), msg = el('msg');
let grid, score, best = 0, over = false, won = false;
try { best = Number(localStorage.getItem('best2048')) || 0; } catch (e) {}
el('best').textContent = best;

const tiles = [];
for (let i = 0; i < SIZE * SIZE; i++) {
  const t = document.createElement('div'); t.className = 'tile';
  boardEl.insertBefore(t, msg); tiles.push(t);
}
function init() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0; over = false; won = false;
  msg.style.display = 'none';
  addTile(); addTile(); render();
}
function addTile() {
  const empty = [];
  grid.forEach((row, y) => row.forEach((v, x) => { if (!v) empty.push([x, y]); }));
  if (!empty.length) return;
  const [x, y] = empty[Math.floor(Math.random() * empty.length)];
  grid[y][x] = Math.random() < 0.9 ? 2 : 4;
}
function render() {
  grid.forEach((row, y) => row.forEach((v, x) => {
    const t = tiles[y * SIZE + x];
    t.textContent = v || '';
    t.style.background = COLORS[v] || '#74c7ec';
    t.style.fontSize = v >= 1000 ? '22px' : v >= 100 ? '26px' : '30px';
  }));
  el('score').textContent = score;
  if (score > best) {
    best = score; el('best').textContent = best;
    try { localStorage.setItem('best2048', best); } catch (e) {}
  }
}
// 1行を左に詰めて合体。戻り値は新しい行
function slideRow(row) {
  const nums = row.filter(v => v);
  const out = [];
  for (let i = 0; i < nums.length; i++) {
    if (nums[i] === nums[i + 1]) { out.push(nums[i] * 2); score += nums[i] * 2; i++; }
    else out.push(nums[i]);
  }
  while (out.length < SIZE) out.push(0);
  return out;
}
function move(dir) {                // dir: left/right/up/down
  if (over) return;
  const before = JSON.stringify(grid);
  const get = i => {
    if (dir === 'left') return grid[i].slice();
    if (dir === 'right') return grid[i].slice().reverse();
    const col = grid.map(r => r[i]);
    return dir === 'up' ? col : col.reverse();
  };
  const set = (i, row) => {
    if (dir === 'left') grid[i] = row;
    else if (dir === 'right') grid[i] = row.reverse();
    else { if (dir === 'down') row.reverse(); row.forEach((v, y) => grid[y][i] = v); }
  };
  for (let i = 0; i < SIZE; i++) set(i, slideRow(get(i)));
  if (JSON.stringify(grid) === before) return;
  addTile(); render();
  if (!won && grid.some(r => r.includes(2048))) { won = true; show('2048 達成!'); }
  else if (!canMove()) { over = true; show('ゲームオーバー'); }
}
function canMove() {
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (!grid[y][x]) return true;
    if (x < SIZE - 1 && grid[y][x] === grid[y][x + 1]) return true;
    if (y < SIZE - 1 && grid[y][x] === grid[y + 1][x]) return true;
  }
  return false;
}
function show(t) { el('msgtext').textContent = t; msg.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  const m = { ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right', ArrowUp:'up', w:'up', ArrowDown:'down', s:'down' };
  if (m[e.key]) { e.preventDefault(); move(m[e.key]); }
});
let t0;
boardEl.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
boardEl.addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
});
el('retry').addEventListener('click', init);
init();
</script>
</body>
</html>
