<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブロック崩し</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; user-select: none; }
  canvas { background: #11111b; border: 2px solid #45475a; border-radius: 8px; max-width: 95vw; touch-action: none; }
  #info { margin: 10px; font-size: 18px; }
  p { font-size: 13px; color: #a6adc8; }
</style>
</head>
<body>
<a href="../" style="position:fixed;top:10px;left:12px;color:#a6adc8;font-size:14px;text-decoration:none;z-index:10">← ゲーム一覧</a>
<div id="info">スコア: <span id="score">0</span> / ライフ: <span id="life">3</span> / ハイスコア: <span id="best">0</span></div>
<canvas id="game" width="480" height="560"></canvas>
<p>← → / マウス / タッチでパドル移動。スペース・クリックでスタート</p>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const COLS = 8, ROWS = 6, BW = W / COLS, BH = 24, TOP = 60;
const ROWCOL = ['#f38ba8', '#fab387', '#f9e2af', '#a6e3a1', '#89b4fa', '#cba6f7'];
const el = id => document.getElementById(id);
let best = 0;
try { best = Number(localStorage.getItem('breakoutBest')) || 0; } catch (e) {}
el('best').textContent = best;

let paddle, ball, bricks, score, life, state = 'ready', left = false, right = false, speed;

function init() {
  paddle = { w: 80, h: 12, x: W / 2 - 40, y: H - 30 };
  bricks = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) bricks.push({ r, c, alive: true });
  score = 0; life = 3; speed = 5;
  updateInfo();
  resetBall();
}
function resetBall() {
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 8, r: 7, vx: 0, vy: 0 };
  state = 'ready';
}
function launch() {
  const a = (Math.random() * 60 - 30) * Math.PI / 180;
  ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a);
  state = 'play';
}
function updateInfo() {
  el('score').textContent = score; el('life').textContent = life;
}
function endGame(win) {
  state = win ? 'win' : 'over';
  if (score > best) {
    best = score; el('best').textContent = best;
    try { localStorage.setItem('breakoutBest', best); } catch (e) {}
  }
}
function update() {
  if (left) paddle.x -= 8;
  if (right) paddle.x += 8;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  if (state === 'ready') { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - 8; return; }
  if (state !== 'play') return;

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

  // パドル:当たった位置で反射角を変える
  if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const t = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const a = t * 65 * Math.PI / 180;
    ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a);
    ball.y = paddle.y - ball.r;
  }
  // ブロック
  for (const b of bricks) {
    if (!b.alive) continue;
    const bx = b.c * BW, by = TOP + b.r * BH;
    if (ball.x + ball.r > bx && ball.x - ball.r < bx + BW && ball.y + ball.r > by && ball.y - ball.r < by + BH) {
      b.alive = false;
      score += (ROWS - b.r) * 10;
      const ox = Math.min(ball.x + ball.r - bx, bx + BW - (ball.x - ball.r));
      const oy = Math.min(ball.y + ball.r - by, by + BH - (ball.y - ball.r));
      if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
      speed = Math.min(9, speed + 0.05);
      const k = speed / Math.hypot(ball.vx, ball.vy);
      ball.vx *= k; ball.vy *= k;
      updateInfo();
      break;
    }
  }
  if (bricks.every(b => !b.alive)) return endGame(true);
  if (ball.y > H + ball.r) {
    life--; updateInfo();
    if (life <= 0) endGame(false); else resetBall();
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = ROWCOL[b.r];
    ctx.fillRect(b.c * BW + 2, TOP + b.r * BH + 2, BW - 4, BH - 4);
  });
  ctx.fillStyle = '#cdd6f4';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  if (state !== 'play') {
    ctx.textAlign = 'center';
    if (state !== 'ready') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = state === 'win' ? '#a6e3a1' : '#f38ba8';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText(state === 'win' ? 'クリア!' : 'ゲームオーバー', W / 2, H / 2 - 10);
      ctx.fillStyle = '#cdd6f4'; ctx.font = '18px sans-serif';
      ctx.fillText('スペース / クリックでリスタート', W / 2, H / 2 + 28);
    } else {
      ctx.fillStyle = '#a6adc8'; ctx.font = '18px sans-serif';
      ctx.fillText('スペース / クリックで発射', W / 2, H / 2 + 80);
    }
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

function action() {
  if (state === 'ready') launch();
  else if (state === 'over' || state === 'win') { init(); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') left = true;
  else if (e.key === 'ArrowRight' || e.key === 'd') right = true;
  else if (e.key === ' ') { e.preventDefault(); action(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') left = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') right = false;
});
function pointer(clientX) {
  const rect = cv.getBoundingClientRect();
  paddle.x = (clientX - rect.left) * (W / rect.width) - paddle.w / 2;
}
cv.addEventListener('mousemove', e => pointer(e.clientX));
cv.addEventListener('touchmove', e => { e.preventDefault(); pointer(e.touches[0].clientX); }, { passive: false });
cv.addEventListener('touchstart', e => { e.preventDefault(); pointer(e.touches[0].clientX); action(); }, { passive: false });
cv.addEventListener('click', action);

init();
loop();
</script>
</body>
</html>
