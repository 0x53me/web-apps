<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マインスイーパー</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; user-select: none; }
  #bar { display: flex; gap: 12px; align-items: center; margin: 12px; font-size: 18px; flex-wrap: wrap; justify-content: center; }
  select, button { font-size: 16px; padding: 6px 12px; border: none; border-radius: 8px; background: #45475a; color: #cdd6f4; cursor: pointer; }
  button.on { background: #f9e2af; color: #1e1e2e; }
  #board { display: grid; gap: 2px; padding: 6px; background: #45475a; border-radius: 8px; touch-action: manipulation; }
  .c { width: var(--s); height: var(--s); display: flex; align-items: center; justify-content: center;
       font-weight: bold; font-size: calc(var(--s) * 0.6); background: #7f849c; border-radius: 3px; cursor: pointer; }
  .c.open { background: #313244; cursor: default; }
  .c.mine { background: #f38ba8; }
  .c.wrong { background: #6c7086; }
  .n1{color:#89b4fa}.n2{color:#a6e3a1}.n3{color:#f38ba8}.n4{color:#cba6f7}
  .n5{color:#fab387}.n6{color:#94e2d5}.n7{color:#f9e2af}.n8{color:#cdd6f4}
  #msg { height: 28px; margin: 8px; font-size: 20px; font-weight: bold; }
  p { font-size: 13px; color: #a6adc8; margin: 0 12px 12px; text-align: center; }
</style>
</head>
<body>
<a href="../" style="position:fixed;top:10px;left:12px;color:#a6adc8;font-size:14px;text-decoration:none;z-index:10">← ゲーム一覧</a>
<div id="bar">
  <select id="level">
    <option value="0">初級 9×9 / 10個</option>
    <option value="1">中級 16×16 / 40個</option>
    <option value="2">上級 24×16 / 70個</option>
  </select>
  <span>💣 <b id="left">10</b></span>
  <span>⏱ <b id="time">0</b></span>
  <button id="flagmode">🚩 旗モード</button>
  <button id="restart">リスタート</button>
</div>
<div id="msg"></div>
<div id="board"></div>
<p>左クリック/タップで開く、右クリック・長押し・旗モードで旗。数字の周りの旗数が合うと、数字をクリックで周囲を一気に開けます。<br>最初の1手は必ず安全です。ベストタイムはレベルごとに保存されます。</p>
<script>
const LEVELS = [{ w: 9, h: 9, m: 10 }, { w: 16, h: 16, m: 40 }, { w: 24, h: 16, m: 70 }];
const el = id => document.getElementById(id);
const boardEl = el('board');
let W, H, M, cells, started, over, flags, opened, timer, secs, flagMode = false, levelIdx = 0;

function bestKey() { return 'msBest' + levelIdx; }
function getBest() { try { return Number(localStorage.getItem(bestKey())) || 0; } catch (e) { return 0; } }

function init() {
  levelIdx = Number(el('level').value);
  ({ w: W, h: H, m: M } = LEVELS[levelIdx]);
  cells = Array.from({ length: W * H }, () => ({ mine: false, open: false, flag: false, n: 0 }));
  started = false; over = false; flags = 0; opened = 0; secs = 0;
  clearInterval(timer);
  el('time').textContent = 0; el('left').textContent = M;
  const b = getBest();
  el('msg').textContent = b ? 'ベスト: ' + b + '秒' : '';
  el('msg').style.color = '#a6adc8';
  const s = Math.max(22, Math.min(34, Math.floor((Math.min(innerWidth, 900) - 40) / W)));
  boardEl.style.setProperty('--s', s + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${W}, var(--s))`;
  boardEl.innerHTML = '';
  cells.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'c'; c.el = d;
    d.addEventListener('click', () => onClick(i));
    d.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(i); });
    // 長押しで旗(タッチ)
    let tm = null, long = false;
    d.addEventListener('touchstart', () => { long = false; tm = setTimeout(() => { long = true; toggleFlag(i); }, 450); }, { passive: true });
    d.addEventListener('touchend', e => { clearTimeout(tm); if (long) e.preventDefault(); });
    d.addEventListener('touchmove', () => clearTimeout(tm), { passive: true });
    boardEl.appendChild(d);
  });
}
function neighbors(i) {
  const x = i % W, y = Math.floor(i / W), r = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H) r.push(ny * W + nx);
  }
  return r;
}
function place(safe) {                 // 最初に開けたマスとその周囲には地雷を置かない
  const ban = new Set([safe, ...neighbors(safe)]);
  const pool = cells.map((_, i) => i).filter(i => !ban.has(i));
  for (let k = 0; k < M; k++) {
    const j = k + Math.floor(Math.random() * (pool.length - k));
    [pool[k], pool[j]] = [pool[j], pool[k]];
    cells[pool[k]].mine = true;
  }
  cells.forEach((c, i) => c.n = neighbors(i).filter(j => cells[j].mine).length);
}
function onClick(i) {
  if (over) return;
  if (flagMode) return toggleFlag(i);
  const c = cells[i];
  if (c.flag) return;
  if (!started) {
    started = true; place(i);
    timer = setInterval(() => { secs++; el('time').textContent = secs; }, 1000);
  }
  if (c.open) return chord(i);
  reveal(i);
  check();
}
function reveal(i) {
  const stack = [i];
  while (stack.length) {
    const k = stack.pop(), c = cells[k];
    if (c.open || c.flag) continue;
    c.open = true; opened++;
    if (c.mine) { lose(k); return; }
    paint(k);
    if (c.n === 0) neighbors(k).forEach(j => stack.push(j));
  }
}
function chord(i) {
  const c = cells[i];
  if (!c.n) return;
  const nb = neighbors(i);
  if (nb.filter(j => cells[j].flag).length !== c.n) return;
  nb.forEach(j => { if (!over) reveal(j); });
  check();
}
function toggleFlag(i) {
  const c = cells[i];
  if (over || c.open) return;
  c.flag = !c.flag; flags += c.flag ? 1 : -1;
  c.el.textContent = c.flag ? '🚩' : '';
  el('left').textContent = M - flags;
}
function paint(i) {
  const c = cells[i], d = c.el;
  d.className = 'c open' + (c.n ? ' n' + c.n : '');
  d.textContent = c.n || '';
}
function check() {
  if (over || opened !== W * H - M) return;
  over = true; clearInterval(timer);
  cells.forEach(c => { if (c.mine && !c.flag) { c.flag = true; c.el.textContent = '🚩'; } });
  el('left').textContent = 0;
  const b = getBest();
  let t = 'クリア! ' + secs + '秒';
  if (!b || secs < b) { t += '(ベスト更新!)'; try { localStorage.setItem(bestKey(), secs); } catch (e) {} }
  el('msg').textContent = t; el('msg').style.color = '#a6e3a1';
}
function lose(hit) {
  over = true; clearInterval(timer);
  cells.forEach((c, i) => {
    if (c.mine && !c.flag) { c.el.className = 'c mine' + (i === hit ? '' : ' open'); c.el.textContent = '💣'; }
    else if (!c.mine && c.flag) { c.el.className = 'c wrong'; c.el.textContent = '❌'; }
  });
  el('msg').textContent = 'ゲームオーバー'; el('msg').style.color = '#f38ba8';
}

el('level').addEventListener('change', init);
el('restart').addEventListener('click', init);
el('flagmode').addEventListener('click', e => { flagMode = !flagMode; e.target.classList.toggle('on', flagMode); });
init();
</script>
</body>
</html>
