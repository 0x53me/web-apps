<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ゲーム集</title>
<link rel="stylesheet" href="list.css">
</head>
<body>
<main>
  <h1>ゲーム集</h1>
  <p class="lead">スマホでもPCでも遊べるブラウザゲーム</p>
  <div id="tags" role="group" aria-label="タグで絞り込み"></div>
  <ul id="list"></ul>
</main>
<script src="catalog.js"></script>
<script>
  // ゲームの追加・タグの変更は catalog.js で行う
  const others = GAMES.filter(g => g.section === 'others');
  renderGameList({
    root: '',
    section: 'main',
    folder: {
      path: 'others/', icon: '🎲', name: 'その他ゲーム', desc: others.map(g => g.name).join('・'), tags: [],
      // 中のゲームのアイコンを並べたサムネイル
      thumb(c, w, h) {
        const g = c.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, '#1b2246'); g.addColorStop(1, '#151c35');
        c.fillStyle = g; c.fillRect(0, 0, w, h);
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '46px system-ui, sans-serif';
        const icons = others.map(o => o.icon), n = icons.length;
        const top = Math.ceil(n / 2);
        icons.forEach((ic, i) => {
          const row = i < top ? 0 : 1, cnt = row ? n - top : top, k = row ? i - top : i;
          c.fillText(ic, w / 2 + (k - (cnt - 1) / 2) * 72, h / 2 + (row ? 40 : -36));
        });
      },
    },
  });
</script>
</body>
</html>
