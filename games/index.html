<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ゲーム集</title>
<link rel="stylesheet" href="list.css">
</head>
<body>
<main>
  <h1>ゲーム集</h1>
  <p class="lead">スマホでもPCでも遊べるブラウザゲーム</p>
  <div id="tags" role="group" aria-label="タグで絞り込み"></div>
  <ul id="list"></ul>
</main>
<script src="catalog.js"></script>
<script>
  // ゲームの追加・タグの変更は catalog.js で行う
  const others = GAMES.filter(g => g.section === 'others');
  renderGameList({
    root: '',
    section: 'main',
    folder: { path: 'others/', icon: '🎲', name: 'その他ゲーム', desc: others.map(g => g.name).join('・'), tags: [] },
  });
</script>
</body>
</html>
