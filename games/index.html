<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ゲーム集</title>
<style>
  :root { --bg: #0b1020; --card: #151c35; --fg: #e8ecff; --muted: #8f9bc7; --accent: #5ce1ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: calc(env(safe-area-inset-top) + 24px) 16px 32px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.card {
    display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 16px;
    background: var(--card); color: inherit; text-decoration: none;
    border: 1px solid rgba(255,255,255,.06);
  }
  a.card:active { transform: scale(.98); }
  .icon { font-size: 32px; width: 48px; text-align: center; flex: none; }
  .name { font-weight: 800; font-size: 18px; }
  .desc { color: var(--muted); font-size: 14px; margin-top: 2px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>ゲーム集</h1>
  <p class="lead">スマホでもPCでも遊べるブラウザゲーム</p>
  <ul id="list"></ul>
</main>
<script>
  // ゲームを追加したらここに1行足す
  const GAMES = [
    { path: 'orbit-dash/', icon: '🪐', name: 'Orbit Dash', desc: 'タップで回転方向を切り替えて、隕石をよけながら★を集める' },
    { path: 'color-gate/', icon: '🚦', name: 'Color Gate', desc: 'タップで自分の色を切り替えて、同じ色のゲートをくぐり抜ける' },
    { path: 'snake/', icon: '🐍', name: 'スネークゲーム', desc: 'エサを食べて長くなろう。壁と自分の体に注意。' },
    { path: 'tetris/', icon: '🧱', name: 'テトリス風', desc: '落ちてくるブロックを並べてラインを消そう。' },
    { path: 'breakout/', icon: '🏓', name: 'ブロック崩し', desc: 'パドルでボールを打ち返して全ブロックを壊そう。' },
    { path: 'game2048/', icon: '🔢', name: '2048', desc: '同じ数字を合体させて2048を目指そう。' },
    { path: 'minesweeper/', icon: '💣', name: 'マインスイーパー', desc: '数字を手がかりに地雷を避けて全マスを開けよう。' },
  ];

  const list = document.getElementById('list');
  for (const g of GAMES) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.path;
    a.innerHTML = `<div class="icon"></div><div><div class="name"></div><div class="desc"></div></div>`;
    a.querySelector('.icon').textContent = g.icon;
    a.querySelector('.name').textContent = g.name;
    a.querySelector('.desc').textContent = g.desc;
    li.appendChild(a);
    list.appendChild(li);
  }
</script>
</body>
</html>
