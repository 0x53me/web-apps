<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スネークゲーム</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; }
  canvas { background: #11111b; border: 2px solid #45475a; border-radius: 8px; max-width: 95vw; touch-action: none; }
  #info { margin: 12px; font-size: 18px; }
  #pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; margin-top: 12px; }
  #pad button { height: 56px; font-size: 22px; border: none; border-radius: 8px; background: #45475a; color: #cdd6f4; }
  #pad button:active { background: #89b4fa; }
</style>
</head>
<body>
<a href="../" style="position:fixed;top:10px;left:12px;color:#a6adc8;font-size:14px;text-decoration:none;z-index:10">← ゲーム一覧</a>
<div id="info">スコア: <span id="score">0</span> / ハイスコア: <span id="best">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<p>矢印キー / WASD / スワイプ / 下のボタンで操作。タップかスペースキーでスタート</p>
<div id="pad">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SIZE = 20, N = canvas.width / SIZE;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
let best = 0;
try { best = Number(localStorage.getItem('snakeBest')) || 0; } catch (e) {}
bestEl.textContent = best;

let snake, dir, nextDir, food, score, timer, running = false;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  clearInterval(timer);
  reset();
  running = true;
  timer = setInterval(step, 120);
  draw();
}

function gameOver() {
  running = false;
  clearInterval(timer);
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('snakeBest', best); } catch (e) {}
  }
  draw();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f38ba8';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ゲームオーバー', canvas.width / 2, canvas.height / 2 - 8);
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '18px sans-serif';
  ctx.fillText('タップ / スペースキーでリスタート', canvas.width / 2, canvas.height / 2 + 24);
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#11111b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#a6e3a1' : '#74c7a0';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

function turn(name) {
  const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  const d = map[name];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
}

document.addEventListener('keydown', e => {
  const keys = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down',
                 ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right' };
  if (e.code === 'Space') { e.preventDefault(); if (!running) start(); return; }
  if (keys[e.key]) { e.preventDefault(); if (running) turn(keys[e.key]); }
});
document.querySelectorAll('#pad button').forEach(b =>
  b.addEventListener('click', () => { if (running) turn(b.dataset.d); else start(); }));

// タッチ: タップでスタート、スワイプで方向転換
let sx = null, sy = null;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!running) { start(); return; }
  sx = e.clientX; sy = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (sx === null || !running) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  sx = e.clientX; sy = e.clientY; // 指を離さずに続けて曲がれる
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { sx = sy = null; }));

reset();
draw();
ctx.fillStyle = '#cdd6f4';
ctx.font = '20px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('タップ / スペースキーでスタート', canvas.width / 2, canvas.height / 2);
</script>
</body>
</html>
