<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ツミアゲ</title>
<style>
  :root {
    --bg: #0b1020;
    --fg: #e8ecff;
    --muted: #8f9bc7;
    --accent: #7dffb2;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--fg);
  }
  canvas { display: block; position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    display: flex; justify-content: space-between; align-items: baseline;
    pointer-events: none; font-weight: 800;
  }
  #score { font-size: 36px; font-variant-numeric: tabular-nums; }
  #bestHud { font-size: 14px; color: var(--muted); }
  #pauseBtn {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06); color: var(--fg); font-size: 16px; font-weight: 800;
    padding: 0;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
    text-align: center; background: rgba(11,16,32,.72);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 48px; letter-spacing: .08em; line-height: 1.1; color: var(--accent); }
  h2 { margin: 0; font-size: 32px; letter-spacing: .06em; }
  .how { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 320px; margin: 4px 0 8px; }
  .how b { color: var(--fg); }
  .big { font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 15px; }
  .record { color: var(--accent); font-weight: 800; font-size: 16px; letter-spacing: .1em; }
  button.main {
    font: inherit; font-size: 20px; font-weight: 800; padding: 14px 44px; margin-top: 8px;
    border: 0; border-radius: 999px; background: var(--accent); color: #00230f;
    box-shadow: 0 6px 24px rgba(125,255,178,.35);
  }
  button.main:active { transform: scale(.96); }
  a.back { color: var(--muted); font-size: 14px; margin-top: 8px; }
  button.share {
    font: inherit; font-size: 15px; font-weight: 700; padding: 10px 26px;
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
    background: rgba(255,255,255,.06); color: var(--fg);
  }
  button.share:active { transform: scale(.96); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="bestHud">BEST 0</div>
</div>
<button id="pauseBtn" class="hidden" aria-label="一時停止">II</button>

<div id="title" class="overlay">
  <h1>ツミアゲ</h1>
  <p class="how">ブロックが左右に動いています。<br><b>タップでブロックを落として積み上げよう。</b><br>はみ出た部分は切り落とされて小さくなる。<br>ぴったり重ねる <b>PERFECT</b> を3回続けると<br>ブロックが少し大きくなる！</p>
  <div class="sub" id="bestTitle"></div>
  <button class="main" id="startBtn">スタート</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<div id="pause" class="overlay hidden">
  <h2>一時停止</h2>
  <button class="main" id="resumeBtn">つづける</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<div id="over" class="overlay hidden">
  <h2>GAME OVER</h2>
  <div class="big" id="finalScore">0</div>
  <div class="record hidden" id="newRecord">NEW RECORD!</div>
  <div class="sub" id="finalInfo"></div>
  <button class="main" id="retryBtn">もう一度</button>
  <button class="share" id="shareBtn">📤 結果をシェア</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<script src="../share.js"></script>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- 調整用パラメータ（単位 U：スマホ縦で約1px） ----------
  const CFG = {
    baseW: 200,       // 最初のブロック幅
    blockH: 26,       // ブロックの高さ
    range: 175,       // 動くブロックの中心が左右に振れる幅
    speedBase: 150,   // 横移動の速さ（U/秒）
    speedGain: 7,     // 1段ごとに増える速さ
    speedMax: 460,
    perfectTol: 5,    // このズレ以内なら PERFECT 扱い
    growAfter: 3,     // PERFECT がこの回数続いたら幅が広がる
    growBy: 12,       // 広がる量
  };

  // ---------- 画面サイズ ----------
  let W, H, U, BASE_Y;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.min(W, H * 0.6) / 400;
    BASE_Y = H * 0.62; // 一番上のブロックがこの高さに来るようにカメラが追う
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 保存 ----------
  let best = 0;
  try { best = Number(localStorage.getItem('tsumiage-best')) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('tsumiage-best', String(best)); } catch (e) {} }

  // ---------- 状態 ----------
  let state = 'title'; // title | play | dying | over | pause
  let score = 0, combo = 0, maxCombo = 0, perfects = 0;
  let cam = 0, shake = 0, dyingT = 0, hue0 = 0;
  let stack = [];   // { x, w } x は中心（U）。index が段数
  let mover = null; // { x, w, dir, speed }
  let debris = [], waves = [], texts = [];

  let quiet = false; // デモ中は振動させない
  const vib = ms => { if (quiet) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const colorOf = (i, l = 62) => `hsl(${(hue0 + i * 7) % 360}, 75%, ${l}%)`;

  // ワールド座標（U, 上向き）→ 画面座標
  const sx = x => W / 2 + x * U;
  const sy = y => BASE_Y - (y - cam) * U;

  function reset() {
    score = 0; combo = 0; maxCombo = 0; perfects = 0; shake = 0;
    hue0 = Math.floor(Math.random() * 360);
    stack = [];
    for (let i = 0; i < 4; i++) stack.push({ x: 0, w: CFG.baseW }); // 土台
    debris = []; waves = []; texts = [];
    cam = topY();
    spawnMover();
    updateHud();
  }

  const topY = () => stack.length * CFG.blockH;

  function spawnMover() {
    const top = stack[stack.length - 1];
    const dir = stack.length % 2 ? 1 : -1;
    const speed = Math.min(CFG.speedBase + score * CFG.speedGain, CFG.speedMax);
    mover = { x: -dir * CFG.range, w: top.w, dir, speed };
  }

  function updateHud() {
    $('score').textContent = score;
    $('bestHud').textContent = 'BEST ' + Math.max(best, score);
  }

  // ---------- 落とす ----------
  function drop() {
    if (state !== 'play' || !mover) return;
    const top = stack[stack.length - 1];
    const i = stack.length;
    const y = topY();
    let d = mover.x - top.x;
    const overlap = mover.w - Math.abs(d);

    if (overlap <= 0) {
      // 完全に外れた
      debris.push(makeDebris(mover.x, mover.w, y, i, Math.sign(d) || 1));
      mover = null;
      die();
      return;
    }

    if (Math.abs(d) <= CFG.perfectTol) {
      // PERFECT：ぴったり揃える
      combo++; perfects++;
      maxCombo = Math.max(maxCombo, combo);
      let w = top.w;
      if (combo >= CFG.growAfter) w = Math.min(w + CFG.growBy, CFG.baseW);
      stack.push({ x: top.x, w });
      waves.push({ x: top.x, w, y, l: 1, i });
      texts.push({ x: top.x, y: y + CFG.blockH, s: combo > 1 ? `PERFECT ×${combo}` : 'PERFECT', l: 1, c: '#7dffb2' });
      vib(combo >= CFG.growAfter ? [15, 30, 15] : 15);
    } else {
      // はみ出た部分を切り落とす
      combo = 0;
      const nx = top.x + d / 2;
      stack.push({ x: nx, w: overlap });
      const cutW = Math.abs(d);
      const cutX = nx + Math.sign(d) * (overlap / 2 + cutW / 2);
      debris.push(makeDebris(cutX, cutW, y, i, Math.sign(d)));
      shake = 3 * U;
      vib(8);
    }
    score++;
    updateHud();
    spawnMover();
  }

  function makeDebris(x, w, y, i, side) {
    return { x, w, y, i, vx: side * (30 + Math.random() * 40), vy: 40, rot: 0, vr: side * (1 + Math.random() * 2) };
  }

  // ---------- 入力 ----------
  cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'play') drop();
      else if (state === 'title' || state === 'over') start();
      else if (state === 'pause') resume();
    }
  });

  function show(id) {
    ['title', 'pause', 'over'].forEach(o => $(o).classList.toggle('hidden', o !== id));
    $('hud').classList.toggle('hidden', state === 'title');
    $('pauseBtn').classList.toggle('hidden', id !== null);
  }

  function start() { reset(); state = 'play'; show(null); }
  function pause() { if (state === 'play') { state = 'pause'; show('pause'); } }
  function resume() { if (state === 'pause') { state = 'play'; show(null); last = performance.now(); } }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('resumeBtn').addEventListener('click', resume);
  let shareText = '';
  $('shareBtn').addEventListener('click', e => { e.currentTarget.blur(); GameShare.share(shareText); });
  $('pauseBtn').addEventListener('pointerdown', e => { e.stopPropagation(); });
  $('pauseBtn').addEventListener('click', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function die() {
    state = 'dying'; dyingT = 1.3; shake = 10 * U;
    combo = 0;
    vib([60, 40, 90]);
    $('pauseBtn').classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    const isRecord = score > best;
    if (isRecord) { best = score; saveBest(); }
    $('finalScore').textContent = score;
    $('newRecord').classList.toggle('hidden', !isRecord || score === 0);
    $('finalInfo').textContent = `PERFECT ${perfects} 回 ・ 最大連続 ${maxCombo} ・ BEST ${best}`;
    shareText = `🏗️ ツミアゲで ${score} 段積み上げた！（PERFECT ${perfects} 回）`;
    updateHud();
    show('over');
  }

  // ---------- 更新 ----------
  function update(dt) {
    if (state === 'play' && mover) {
      mover.x += mover.dir * mover.speed * dt;
      if (mover.x > CFG.range) { mover.x = CFG.range; mover.dir = -1; }
      if (mover.x < -CFG.range) { mover.x = -CFG.range; mover.dir = 1; }
    } else if (state === 'dying') {
      dyingT -= dt;
      if (dyingT <= 0) gameOver();
    } else if (state === 'title') {
      // タイトル裏で自動で積み上げるデモ
      demo(dt);
    }

    // カメラ：一番上のブロックを追う
    cam += (topY() - cam) * Math.min(1, dt * 6);

    for (const q of debris) {
      q.vy -= 900 * dt;
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    }
    debris = debris.filter(q => sy(q.y) < H + 200);
    for (const w of waves) w.l -= dt * 1.6;
    waves = waves.filter(w => w.l > 0);
    for (const s of texts) { s.y += 30 * dt; s.l -= dt * 1.2; }
    texts = texts.filter(s => s.l > 0);
    shake *= Math.pow(0.02, dt);
  }

  // タイトル画面のデモ（自動プレイ）
  let demoT = 0;
  function demo(dt) {
    if (stack.length === 0 || stack.length > 60) { reset(); }
    if (!mover) spawnMover();
    mover.x += mover.dir * mover.speed * dt;
    if (mover.x > CFG.range) { mover.x = CFG.range; mover.dir = -1; }
    if (mover.x < -CFG.range) { mover.x = -CFG.range; mover.dir = 1; }
    const top = stack[stack.length - 1];
    demoT += dt;
    if (demoT > 0.4 && Math.abs(mover.x - top.x) < 14 + Math.random() * 20) {
      demoT = 0;
      quiet = true; state = 'play';
      drop();
      if (state !== 'play') reset(); // 外したら最初から
      state = 'title'; quiet = false;
    }
  }

  // ---------- 描画 ----------
  function drawBlock(x, y, w, i, alpha = 1) {
    const h = CFG.blockH * U;
    const px = sx(x - w / 2), py = sy(y + CFG.blockH), pw = w * U;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = colorOf(i);
    ctx.fillRect(px, py, pw, h);
    ctx.fillStyle = colorOf(i, 74);
    ctx.fillRect(px, py, pw, h * 0.22);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(px, py + h * 0.82, pw, h * 0.18);
    ctx.globalAlpha = 1;
  }

  function draw() {
    // 高く積むほど空が暗く・色が変わる背景
    const k = Math.min(1, cam / 2500);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${(hue0 + 200) % 360}, ${40 - k * 20}%, ${16 - k * 10}%)`);
    g.addColorStop(1, `hsl(${(hue0 + 160) % 360}, ${45 - k * 20}%, ${24 - k * 14}%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 星（高度とともに見えてくる）
    if (k > 0.05) {
      ctx.fillStyle = '#ffffff';
      for (let n = 0; n < 50; n++) {
        const x = (n * 97.3) % W;
        const y = ((n * 61.7 + cam * U * 0.15) % H + H) % H;
        ctx.globalAlpha = k * (0.3 + (n % 5) * 0.12);
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 地面
    const gy = sy(0);
    if (gy < H) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, gy, W, H - gy);
    }

    // 積まれたブロック（画面内だけ描く）
    for (let i = 0; i < stack.length; i++) {
      const y = i * CFG.blockH;
      const py = sy(y);
      if (py < -CFG.blockH * U || py - CFG.blockH * U > H) continue;
      drawBlock(stack[i].x, y, stack[i].w, i);
    }

    // PERFECT の波紋
    for (const w of waves) {
      const e = 1 - w.l;
      const grow = 6 + e * 22;
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = w.l * 0.8;
      ctx.lineWidth = 2 * U;
      ctx.strokeRect(sx(w.x - w.w / 2 - grow), sy(w.y + CFG.blockH + grow), (w.w + grow * 2) * U, (CFG.blockH + grow * 2) * U);
    }
    ctx.globalAlpha = 1;

    // 動いているブロック
    if (mover && (state === 'play' || state === 'pause' || state === 'title')) {
      const y = topY();
      // 落下位置のガイド
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(sx(mover.x - mover.w / 2), sy(y), mover.w * U, (sy(y - 400) - sy(y)));
      drawBlock(mover.x, y, mover.w, stack.length);
    }

    // 切り落とされた破片
    for (const q of debris) {
      ctx.save();
      ctx.translate(sx(q.x), sy(q.y + CFG.blockH / 2));
      ctx.rotate(q.rot);
      ctx.fillStyle = colorOf(q.i);
      ctx.fillRect(-q.w * U / 2, -CFG.blockH * U / 2, q.w * U, CFG.blockH * U);
      ctx.restore();
    }

    // テキスト
    ctx.font = `800 ${20 * U}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    for (const s of texts) {
      ctx.globalAlpha = Math.max(0, s.l);
      ctx.fillStyle = s.c;
      ctx.fillText(s.s, sx(s.x), sy(s.y + 20));
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- ループ ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (state !== 'pause') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  $('bestTitle').textContent = best > 0 ? `BEST ${best}` : '';
  reset();
  show('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
