<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Orbit Dash</title>
<style>
  :root {
    --bg: #0b1020;
    --fg: #e8ecff;
    --muted: #8f9bc7;
    --accent: #ffd84d;
    --player: #5ce1ff;
    --danger: #ff5c7a;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--fg);
  }
  canvas { display: block; position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    display: flex; justify-content: space-between; align-items: baseline;
    pointer-events: none; font-weight: 800;
  }
  #score { font-size: 36px; font-variant-numeric: tabular-nums; }
  #bestHud { font-size: 14px; color: var(--muted); }
  #pauseBtn {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06); color: var(--fg); font-size: 16px; font-weight: 800;
    padding: 0;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
    text-align: center; background: rgba(11,16,32,.72);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 44px; letter-spacing: .06em; line-height: 1.1; }
  h1 span { color: var(--player); }
  h2 { margin: 0; font-size: 32px; letter-spacing: .06em; }
  .how { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 320px; margin: 4px 0 8px; }
  .how b { color: var(--fg); }
  .big { font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 15px; }
  .record { color: var(--accent); font-weight: 800; font-size: 16px; letter-spacing: .1em; }
  button.main {
    font: inherit; font-size: 20px; font-weight: 800; padding: 14px 44px; margin-top: 8px;
    border: 0; border-radius: 999px; background: var(--accent); color: #1a1300;
    box-shadow: 0 6px 24px rgba(255,216,77,.35);
  }
  button.main:active { transform: scale(.96); }
  a.back { color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="bestHud">BEST 0</div>
</div>
<button id="pauseBtn" class="hidden" aria-label="一時停止">II</button>

<div id="title" class="overlay">
  <h1>ORBIT<br><span>DASH</span></h1>
  <p class="how">ボールは円の上を回り続けます。<br><b>画面タップで回る向きが逆に。</b><br>隕石をよけて ★ を集めよう！</p>
  <div class="sub" id="bestTitle"></div>
  <button class="main" id="startBtn">スタート</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<div id="pause" class="overlay hidden">
  <h2>一時停止</h2>
  <button class="main" id="resumeBtn">つづける</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<div id="over" class="overlay hidden">
  <h2>GAME OVER</h2>
  <div class="big" id="finalScore">0</div>
  <div class="record hidden" id="newRecord">NEW RECORD!</div>
  <div class="sub" id="finalInfo"></div>
  <button class="main" id="retryBtn">もう一度</button>
  <a class="back" href="../">← ゲーム一覧</a>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  // ---------- 画面サイズ ----------
  let W, H, CX, CY, R, U;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H / 2 + 16;
    R = Math.min(W, H) * 0.32;
    U = R / 120; // 基準単位（スマホ縦で約1px）
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 保存 ----------
  let best = 0;
  try { best = Number(localStorage.getItem('orbit-dash-best')) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem('orbit-dash-best', String(best)); } catch (e) {} }

  // ---------- 状態 ----------
  let state = 'title'; // title | play | dying | over | pause
  let t = 0, score = 0, spawnT = 0, shake = 0, flash = 0, dyingT = 0;
  const p = { a: -Math.PI / 2, dir: 1, trail: [] };
  let meteors = [], parts = [], texts = [], star = null;
  const bgStars = Array.from({ length: 90 }, () => ({
    x: Math.random(), y: Math.random(), s: Math.random() * 1.4 + 0.3, ph: Math.random() * TAU
  }));

  const angDist = (a, b) => { let d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; };
  const ringPos = a => [CX + Math.cos(a) * R, CY + Math.sin(a) * R];
  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function reset() {
    t = 0; score = 0; spawnT = 1.2; shake = 0; flash = 0;
    p.a = -Math.PI / 2; p.dir = 1; p.trail = [];
    meteors = []; parts = []; texts = [];
    newStar();
    updateHud();
  }

  function newStar() {
    let a;
    do { a = Math.random() * TAU; } while (angDist(a, p.a) < 1.3);
    star = { a, age: 0 };
  }

  function spawnMeteor() {
    const a = Math.random() * TAU;
    const D = Math.hypot(W, H) / 2 + 40;
    const sx = CX + Math.cos(a) * D, sy = CY + Math.sin(a) * D;
    const ta = Math.random() * TAU, tr = Math.random() * R * 0.55;
    const tx = CX + Math.cos(ta) * tr, ty = CY + Math.sin(ta) * tr;
    const sp = U * Math.min(95 + t * 3, 240) * (0.85 + Math.random() * 0.3);
    const d = Math.hypot(tx - sx, ty - sy);
    const big = Math.random() < Math.min(0.1 + t * 0.008, 0.35);
    const r = U * (big ? 14 : 8);
    // ごつごつした形
    const n = 8, shape = [];
    for (let i = 0; i < n; i++) shape.push(0.75 + Math.random() * 0.35);
    meteors.push({
      x: sx, y: sy, vx: (tx - sx) / d * sp, vy: (ty - sy) / d * sp, r,
      life: (2 * D) / sp + 1, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 3, shape
    });
  }

  function burst(x, y, color, n, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = (40 + Math.random() * 160) * U * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, d: 0.6 + Math.random() * 0.5, c: color, r: (1.5 + Math.random() * 2.5) * U });
    }
  }

  function updateHud() {
    $('score').textContent = score;
    $('bestHud').textContent = 'BEST ' + Math.max(best, score);
  }

  // ---------- 入力 ----------
  function flip() {
    if (state !== 'play') return;
    p.dir *= -1;
    flash = 1;
    const [x, y] = ringPos(p.a);
    burst(x, y, '#5ce1ff', 5, 0.5);
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); flip(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'play') flip();
      else if (state === 'title') start();
      else if (state === 'over') start();
      else if (state === 'pause') resume();
    }
  });

  function show(id) {
    ['title', 'pause', 'over'].forEach(o => $(o).classList.toggle('hidden', o !== id));
    const playing = id === null;
    $('hud').classList.toggle('hidden', state === 'title');
    $('pauseBtn').classList.toggle('hidden', !playing);
  }

  function start() { reset(); state = 'play'; show(null); }
  function pause() { if (state === 'play') { state = 'pause'; show('pause'); } }
  function resume() { if (state === 'pause') { state = 'play'; show(null); last = performance.now(); } }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('resumeBtn').addEventListener('click', resume);
  $('pauseBtn').addEventListener('pointerdown', e => { e.stopPropagation(); });
  $('pauseBtn').addEventListener('click', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function die(x, y) {
    state = 'dying'; dyingT = 0.9; shake = 14 * U;
    burst(x, y, '#5ce1ff', 30, 1.4);
    burst(x, y, '#ff5c7a', 20, 1.1);
    vib([60, 40, 90]);
    $('pauseBtn').classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    const isRecord = score > best;
    if (isRecord) { best = score; saveBest(); }
    $('finalScore').textContent = score;
    $('newRecord').classList.toggle('hidden', !isRecord || score === 0);
    $('finalInfo').textContent = `生存 ${t.toFixed(1)} 秒 ・ BEST ${best}`;
    updateHud();
    show('over');
  }

  // ---------- 更新 ----------
  function update(dt) {
    if (state === 'play') {
      t += dt;
      const w = 1.7 + Math.min(t * 0.025, 1.3); // 角速度（rad/s）
      p.a += p.dir * w * dt;
      const [px, py] = ringPos(p.a);
      p.trail.push([px, py]);
      if (p.trail.length > 16) p.trail.shift();

      spawnT -= dt;
      if (spawnT <= 0) {
        spawnMeteor();
        spawnT = Math.max(0.38, 1.5 - t * 0.025) * (0.7 + Math.random() * 0.6);
      }

      star.age += dt;
      const [sx, sy] = ringPos(star.a);
      const pr = 9 * U;
      if (Math.hypot(px - sx, py - sy) < pr + 11 * U) {
        score++;
        burst(sx, sy, '#ffd84d', 16);
        texts.push({ x: sx, y: sy, s: '+1', l: 1 });
        vib(12);
        newStar();
        updateHud();
      }

      for (const m of meteors) {
        m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt; m.rot += m.vr * dt;
        if (Math.hypot(m.x - px, m.y - py) < pr + m.r * 0.8) { die(px, py); break; }
      }
      meteors = meteors.filter(m => m.life > 0);
    } else if (state === 'dying') {
      for (const m of meteors) { m.x += m.vx * dt * 0.3; m.y += m.vy * dt * 0.3; m.rot += m.vr * dt; }
      dyingT -= dt;
      if (dyingT <= 0) gameOver();
    } else if (state === 'title' || state === 'over') {
      p.a += 0.8 * dt; // 背景でゆっくり回す
    }

    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; q.l -= dt / q.d; }
    parts = parts.filter(q => q.l > 0);
    for (const s of texts) { s.y -= 40 * U * dt; s.l -= dt * 1.4; }
    texts = texts.filter(s => s.l > 0);
    shake *= Math.pow(0.02, dt);
    flash = Math.max(0, flash - dt * 5);
  }

  // ---------- 描画 ----------
  function drawStarShape(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r;
      const a = rot + i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function draw(now) {
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);

    // 背景の星
    for (const s of bgStars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now / 900 + s.ph);
      ctx.fillStyle = '#c9d4ff';
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 軌道リング
    ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(120,150,255,${0.28 + flash * 0.4})`;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
    ctx.lineWidth = 10 * U;
    ctx.strokeStyle = 'rgba(120,150,255,0.06)';
    ctx.stroke();

    // 中心核
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 26 * U);
    g.addColorStop(0, 'rgba(160,130,255,0.9)');
    g.addColorStop(1, 'rgba(160,130,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, CY, 26 * U, 0, TAU); ctx.fill();

    const inGame = state === 'play' || state === 'dying' || state === 'pause';

    // ★
    if (inGame && star) {
      const [sx, sy] = ringPos(star.a);
      const pulse = 1 + Math.sin(star.age * 6) * 0.12;
      const appear = Math.min(1, star.age * 4);
      ctx.shadowColor = '#ffd84d'; ctx.shadowBlur = 16 * U;
      ctx.fillStyle = '#ffd84d';
      drawStarShape(sx, sy, 11 * U * pulse * appear, star.age * 1.5);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 隕石
    for (const m of meteors) {
      const sp = Math.hypot(m.vx, m.vy);
      const tx = -m.vx / sp, ty = -m.vy / sp;
      const tg = ctx.createLinearGradient(m.x, m.y, m.x + tx * m.r * 4, m.y + ty * m.r * 4);
      tg.addColorStop(0, 'rgba(255,120,90,0.45)');
      tg.addColorStop(1, 'rgba(255,120,90,0)');
      ctx.strokeStyle = tg; ctx.lineWidth = m.r * 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + tx * m.r * 4, m.y + ty * m.r * 4); ctx.stroke();

      ctx.fillStyle = '#ff5c7a';
      ctx.beginPath();
      m.shape.forEach((k, i) => {
        const a = m.rot + i / m.shape.length * TAU;
        ctx.lineTo(m.x + Math.cos(a) * m.r * k, m.y + Math.sin(a) * m.r * k);
      });
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.arc(m.x + m.r * 0.2, m.y + m.r * 0.15, m.r * 0.3, 0, TAU); ctx.fill();

      // 画面外の接近警告
      const M = 14;
      if (m.x < 0 || m.x > W || m.y < 0 || m.y > H) {
        const ex = Math.min(W - M, Math.max(M, m.x)), ey = Math.min(H - M, Math.max(M, m.y));
        const a = Math.atan2(m.vy, m.vx);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
        ctx.fillStyle = 'rgba(255,92,122,0.75)';
        ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // プレイヤー
    if (state !== 'dying' && state !== 'over') {
      for (let i = 0; i < p.trail.length; i++) {
        const [x, y] = p.trail[i];
        const k = i / p.trail.length;
        ctx.fillStyle = `rgba(92,225,255,${k * 0.35})`;
        ctx.beginPath(); ctx.arc(x, y, 9 * U * k, 0, TAU); ctx.fill();
      }
      const [px, py] = ringPos(p.a);
      ctx.shadowColor = '#5ce1ff'; ctx.shadowBlur = 18 * U;
      ctx.fillStyle = '#5ce1ff';
      ctx.beginPath(); ctx.arc(px, py, 9 * U * (1 + flash * 0.25), 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, 4 * U, 0, TAU); ctx.fill();
      // 進行方向の小さな矢印
      if (inGame) {
        const ta = p.a + p.dir * 0.22;
        const [ax, ay] = ringPos(ta);
        ctx.fillStyle = 'rgba(92,225,255,0.6)';
        ctx.beginPath(); ctx.arc(ax, ay, 2.5 * U, 0, TAU); ctx.fill();
      }
    }

    // パーティクル・テキスト
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.l);
      ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = `800 ${18 * U}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    for (const s of texts) {
      ctx.globalAlpha = Math.max(0, s.l);
      ctx.fillStyle = '#ffd84d';
      ctx.fillText(s.s, s.x, s.y - 16 * U);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- ループ ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (state !== 'pause') update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  $('bestTitle').textContent = best > 0 ? `BEST ${best}` : '';
  show('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
