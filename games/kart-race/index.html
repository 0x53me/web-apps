<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no などでピンチ拡大を止める -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ターボサーキット</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js をバージョン固定で CDN から読み込む("three" という名前で import できるようにする) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- 3D の描画先 -->
  <canvas id="game"></canvas>

  <a class="back" href="../">← 一覧</a>

  <!-- レース中の表示 -->
  <div id="hud" hidden>
    <div id="rank" class="rank">4th</div>
    <div class="race-info">
      <div id="lap" class="lap">LAP 1/3</div>
      <div id="time" class="time">0:00.00</div>
      <ol id="lap-list" class="lap-list"></ol>
    </div>
    <div class="speed"><span id="speed-val">0</span><small>km/h</small></div>
  </div>

  <!-- 画面中央の短いメッセージと、逆走の警告 -->
  <div id="message" class="message" hidden></div>
  <div id="wrong-way" class="wrong-way" hidden>⚠ 逆走中</div>

  <!-- ゴール画面(順位つきのリザルトは後で作り込む) -->
  <div id="finish" class="overlay" hidden>
    <div class="panel">
      <h1>FINISH!</h1>
      <p id="finish-rank" class="finish-rank"></p>
      <p class="total">TOTAL <span id="finish-total">0:00.00</span></p>
      <ol id="finish-laps" class="finish-laps"></ol>
      <p id="finish-best" class="best"></p>
      <div class="modes">
        <button type="button" id="btn-retry" class="mode">もう一度</button>
        <button type="button" id="btn-title" class="mode">タイトルへ</button>
      </div>
    </div>
  </div>

  <!-- スマホ用の操作ボタン(data-key が操作の種類)。アクセルは自動なのでボタンはない -->
  <div id="controls" hidden>
    <button type="button" data-key="left" aria-label="左">◀</button>
    <button type="button" data-key="right" aria-label="右">▶</button>
    <button type="button" data-key="brake" aria-label="ブレーキ">BRAKE</button>
    <button type="button" data-key="drift" aria-label="ドリフト">DRIFT</button>
  </div>

  <!-- タイトル画面 -->
  <div id="title" class="overlay">
    <div class="panel">
      <h1>ターボサーキット</h1>
      <p class="sub">3D カートレース</p>
      <div class="levels" role="group" aria-label="CPUの強さ">
        <span class="levels-label">CPU</span>
        <button type="button" data-level="easy">かんたん</button>
        <button type="button" data-level="normal">ふつう</button>
        <button type="button" data-level="hard">むずかしい</button>
      </div>
      <p class="label">操作方法をえらんでスタート</p>
      <div class="modes">
        <button type="button" id="btn-buttons" class="mode">
          <span class="ic">🎮</span>ボタン操作
        </button>
        <button type="button" id="btn-tilt" class="mode">
          <span class="ic">📱</span>傾け操作
        </button>
      </div>
      <p class="hint">スマホはアクセル自動(BRAKE で減速・バック)<br>PC: 矢印キー / WASD で操作、Shift でドリフト</p>
    </div>
  </div>

  <!-- 縦向きのときの案内 -->
  <div id="rotate" class="overlay">
    <div class="rotate-msg">
      <div class="rotate-ic">📱</div>
      横向きにして遊んでください
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
